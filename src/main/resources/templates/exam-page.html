
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Examination | ExamEase</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <style>
        body {
            background: var(--background);
            color: var(--text);
        }

        .navbar {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
        }

        .navbar-brand {
            color: var(--text);
            font-size: 23px;
            font-weight: 750;
            text-decoration: none;
        }

        .navbar-brand:hover {
            color: var(--text);
        }

        .brand-dot {
            color: var(--primary);
        }

        .theme-toggle {
            width: 40px;
            height: 40px;
            border: 1px solid var(--border);
            border-radius: 50%;
            background: var(--surface-secondary);
            color: var(--text);
        }

        .exam-header,
        .question-card,
        .progress-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
        }

        .exam-header {
            padding: 25px;
        }

        .question-card {
            padding: 24px;
            margin-bottom: 18px;
        }

        .question-number {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 34px;
            margin-right: 8px;
            border-radius: 10px;
            background: var(--primary-light);
            color: var(--text);
            font-weight: 700;
        }

        .option-row {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 12px 14px;
            margin-bottom: 9px;
            border: 1px solid var(--border);
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
        }

        .option-row:hover {
            background: var(--surface-secondary);
            border-color: var(--primary);
        }

        .option-row .form-check-input {
            flex-shrink: 0;
            margin-top: 5px;
        }

        .form-check-input:checked {
            background-color: var(--primary);
            border-color: var(--primary);
        }

        .timer-card {
            min-width: 145px;
            padding: 14px 18px;
            text-align: center;
            background: var(--primary-light);
            border-radius: 14px;
        }

        .timer {
            font-size: 27px;
            font-weight: 750;
            font-variant-numeric: tabular-nums;
            color: var(--text);
        }

        .muted-text {
            color: var(--muted);
        }

        .progress {
            height: 8px;
            background: var(--surface-secondary);
        }

        .progress-bar {
            background: var(--primary);
        }

        .submit-button {
            padding: 12px 28px;
            border: none;
            border-radius: 11px;
            background: var(--primary);
            color: white;
            font-weight: 600;
        }

        .submit-button:hover {
            background: var(--primary-hover);
            color: white;
        }

        @media (max-width: 576px) {
            .exam-header {
                padding: 20px;
            }

            .question-card {
                padding: 18px;
            }

            .timer-card {
                min-width: 110px;
                padding: 10px;
            }

            .timer {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

<nav class="navbar sticky-top py-3">
    <div class="container d-flex align-items-center justify-content-between">
        <a class="navbar-brand" href="/">
            ExamEase<span class="brand-dot">.</span>
        </a>

        <div class="d-flex align-items-center gap-3">
            <span class="muted-text d-none d-sm-inline">
                Online Examination
            </span>

            <button class="theme-toggle"
                    id="themeToggle"
                    type="button"
                    aria-label="Toggle dark mode">
                <span id="themeIcon">☾</span>
            </button>
        </div>
    </div>
</nav>

<main class="container py-4 py-md-5">

    <section class="exam-header mb-4">
        <div class="d-flex flex-column flex-md-row
                    justify-content-between align-items-md-center gap-4">

            <div>
                <span class="badge rounded-pill mb-3"
                      style="background: var(--primary-light); color: var(--text);">
                    EXAM IN PROGRESS
                </span>

                <h2 class="fw-bold mb-2" th:text="${exam.title}">
                    Examination Title
                </h2>

                <p class="muted-text mb-0">
                    Answer each question carefully. Your answers will be
                    submitted when you finish or when the timer reaches zero.
                </p>
            </div>

            <div class="timer-card">
                <div class="muted-text small mb-1">Time Remaining</div>
                <div class="timer" id="timer">Loading...</div>
            </div>

        </div>
    </section>

    <section class="progress-card p-3 p-md-4 mb-4">
        <div class="d-flex justify-content-between align-items-center mb-2">
            <strong>Answer progress</strong>
            <span class="muted-text" id="answerCount">
                0 answered
            </span>
        </div>

        <div class="progress" role="progressbar"
             aria-label="Answered questions">
            <div class="progress-bar"
                 id="answerProgress"
                 style="width: 0%">
            </div>
        </div>
    </section>

    <form th:action="@{/submit-exam/{id}(id=${exam.id})}"
          method="post"
          id="examForm">

        <div th:each="question, status : ${questions}"
             class="question-card">

            <h5 class="fw-bold mb-4">
                <span class="question-number"
                      th:text="${status.count}">1</span>
                <span th:text="${question.questionText}">
                    Question text
                </span>
            </h5>

            <div>
                <label class="option-row">
                    <input class="form-check-input"
                           type="radio"
                           th:name="${'q_' + question.id}"
                           value="A">
                    <span th:text="${'A. ' + question.optionA}">
                        Option A
                    </span>
                </label>

                <label class="option-row">
                    <input class="form-check-input"
                           type="radio"
                           th:name="${'q_' + question.id}"
                           value="B">
                    <span th:text="${'B. ' + question.optionB}">
                        Option B
                    </span>
                </label>

                <label class="option-row">
                    <input class="form-check-input"
                           type="radio"
                           th:name="${'q_' + question.id}"
                           value="C">
                    <span th:text="${'C. ' + question.optionC}">
                        Option C
                    </span>
                </label>

                <label class="option-row mb-0">
                    <input class="form-check-input"
                           type="radio"
                           th:name="${'q_' + question.id}"
                           value="D">
                    <span th:text="${'D. ' + question.optionD}">
                        Option D
                    </span>
                </label>
            </div>

        </div>

        <div class="text-center py-4">
            <button type="submit"
                    class="btn submit-button"
                    onclick="return confirm('Are you sure you want to submit your examination?')">
                Submit Examination
            </button>
        </div>

    </form>

</main>

<script th:inline="javascript">
    // Countdown timer
    let duration = [[${exam.durationMinutes}]] * 60;

    const timerElement = document.getElementById("timer");
    const examForm = document.getElementById("examForm");

    let timerInterval;
    let submittedAutomatically = false;

    function updateTimer() {
        const minutes = Math.floor(duration / 60);
        const seconds = duration % 60;

        timerElement.textContent =
            String(minutes).padStart(2, "0") + ":" +
            String(seconds).padStart(2, "0");

        if (duration <= 0) {
            clearInterval(timerInterval);

            if (!submittedAutomatically) {
                submittedAutomatically = true;
                alert("Time is over. Your examination will be submitted.");
                examForm.submit();
            }

            return;
        }

        duration--;
    }

    updateTimer();
    timerInterval = setInterval(updateTimer, 1000);

    // Update answered-question progress
    const questionCount =
        document.querySelectorAll(".question-card").length;

    const answerCount = document.getElementById("answerCount");
    const answerProgress = document.getElementById("answerProgress");

    function updateAnswerProgress() {
        const answeredCount =
            document.querySelectorAll(
                ".question-card input[type='radio']:checked"
            ).length;

        answerCount.textContent =
            answeredCount + " of " + questionCount + " answered";

        const percentage = questionCount === 0
            ? 0
            : (answeredCount / questionCount) * 100;

        answerProgress.style.width = percentage + "%";
    }

    document.querySelectorAll(".question-card input[type='radio']")
        .forEach(function (radio) {
            radio.addEventListener("change", updateAnswerProgress);
        });

    updateAnswerProgress();

    // Light and dark mode
    const themeToggle = document.getElementById("themeToggle");
    const themeIcon = document.getElementById("themeIcon");

    function applyTheme(theme) {
        document.documentElement.setAttribute("data-theme", theme);
        document.body.setAttribute("data-theme", theme);
        themeIcon.textContent = theme === "dark" ? "☀" : "☾";
    }

    const savedTheme = localStorage.getItem("theme") || "light";
    applyTheme(savedTheme);

    themeToggle.addEventListener("click", function () {
        const currentTheme =
            document.documentElement.getAttribute("data-theme");

        const newTheme = currentTheme === "dark" ? "light" : "dark";

        localStorage.setItem("theme", newTheme);
        applyTheme(newTheme);
    });
</script>

</body>
</html>
