
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Result | ExamEase</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <style>
        body {
            background: var(--background);
            color: var(--text);
        }

        .navbar {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
        }

        .navbar-brand {
            color: var(--text);
            font-size: 23px;
            font-weight: 750;
            text-decoration: none;
        }

        .navbar-brand:hover {
            color: var(--text);
        }

        .brand-dot {
            color: var(--primary);
        }

        .theme-toggle {
            width: 40px;
            height: 40px;
            border: 1px solid var(--border);
            border-radius: 50%;
            background: var(--surface-secondary);
            color: var(--text);
        }

        .result-card {
            width: 100%;
            max-width: 590px;
            margin: 55px auto;
            padding: 40px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            box-shadow: var(--shadow);
            text-align: center;
        }

        .result-icon {
            width: 66px;
            height: 66px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: var(--primary-light);
            font-size: 30px;
        }

        .score {
            margin-top: 22px;
            font-size: 48px;
            line-height: 1.2;
            font-weight: 750;
            color: var(--text);
            font-variant-numeric: tabular-nums;
        }

        .muted-text {
            color: var(--muted);
        }

        .result-progress {
            height: 12px;
            background: var(--surface-secondary);
            border-radius: 20px;
        }

        .result-progress .progress-bar {
            background: var(--primary);
            border-radius: 20px;
        }

        .student-details {
            padding: 15px;
            margin-top: 25px;
            background: var(--surface-secondary);
            border-radius: 12px;
        }

        .back-button {
            display: inline-block;
            padding: 12px 22px;
            border-radius: 11px;
            background: var(--primary);
            color: white;
            font-weight: 600;
            text-decoration: none;
        }

        .back-button:hover {
            background: var(--primary-hover);
            color: white;
        }

        @media (max-width: 576px) {
            .result-card {
                margin: 30px auto;
                padding: 28px 20px;
            }

            .score {
                font-size: 42px;
            }
        }
    </style>
</head>

<body>

<nav class="navbar sticky-top py-3">
    <div class="container d-flex align-items-center justify-content-between">
        <a class="navbar-brand" href="/">
            ExamEase<span class="brand-dot">.</span>
        </a>

        <button class="theme-toggle"
                id="themeToggle"
                type="button"
                aria-label="Toggle dark mode">
            <span id="themeIcon">☾</span>
        </button>
    </div>
</nav>

<main class="container">

    <section class="result-card"
             th:with="percentage=${result.totalQuestions > 0 ? (result.score * 100.0 / result.totalQuestions) : 0}">

        <div class="result-icon">✓</div>

        <h2 class="fw-bold mb-2">
            Examination Submitted!
        </h2>

        <p class="muted-text mb-0">
            Your result has been calculated.
        </p>

        <div class="student-details">
            <h5 class="fw-bold mb-1"
                th:text="${result.studentName}">
                Student Name
            </h5>

            <p class="muted-text mb-2">
                Roll Number:
                <strong th:text="${result.rollNumber}">Roll Number</strong>
            </p>

            <p class="fw-semibold mb-0"
               th:text="${exam.title}">
                Examination Title
            </p>
        </div>

        <div class="score">
            <span th:text="${result.score}">0</span>
            <span class="muted-text">/</span>
            <span th:text="${result.totalQuestions}">0</span>
        </div>

        <p class="muted-text mb-3">Your Score</p>

        <div class="progress result-progress"
             role="progressbar"
             aria-label="Exam score"
             th:attr="aria-valuenow=${percentage}"
             aria-valuemin="0"
             aria-valuemax="100">

            <div class="progress-bar"
                 th:style="|width: ${percentage}%|">
            </div>
        </div>

        <p class="mt-3 mb-0">
            Percentage:
            <strong th:text="|${#numbers.formatDecimal(percentage, 1, 1)}%|">
                0.0%
            </strong>
        </p>

        <a th:href="@{/exams}" class="back-button mt-4">
            Back to Examinations →
        </a>

    </section>

</main>

<script>
    // Light and dark mode
    const themeToggle = document.getElementById("themeToggle");
    const themeIcon = document.getElementById("themeIcon");

    function applyTheme(theme) {
        document.documentElement.setAttribute("data-theme", theme);
        document.body.setAttribute("data-theme", theme);
        themeIcon.textContent = theme === "dark" ? "☀" : "☾";
    }

    const savedTheme = localStorage.getItem("theme") || "light";
    applyTheme(savedTheme);

    themeToggle.addEventListener("click", function () {
        const currentTheme =
            document.documentElement.getAttribute("data-theme");

        const newTheme = currentTheme === "dark" ? "light" : "dark";

        localStorage.setItem("theme", newTheme);
        applyTheme(newTheme);
    });
</script>

</body>
</html>
